name: Weekly BABA luminaire update

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays, 13:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check state DOT lists for changes
        run: python3 scripts/check_sources.py

      - name: Rebuild index.html, fixtures.html and weekly snapshot
        run: |
          python3 scripts/build_site.py
          python3 scripts/build_fixtures.py

      - name: Commit updated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fixtures.html archive data/source_status.json data/changed_sources.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly BABA luminaire update $(date -u +%F)"
            git push
          fi

      - name: Open review issue when DOT lists changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "^## " data/changed_sources.md; then
            gh issue create \
              --title "Weekly review: DOT product lists changed ($(date -u +%F))" \
              --body-file data/changed_sources.md
          fi
